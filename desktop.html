<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italy Trip Dashboard</title>
<script>
const BASE="https://raw.githubusercontent.com/susanlondon/italy-weather-trip/e1a4ce6d3616110503cb712c1ff83cb9c2325737/index.html";
Promise.all([
  fetch(BASE).then(r=>{if(!r.ok)throw Error('base');return r.text()}),
  fetch("./guide-data-v1.3.json?v=1.3.2").then(r=>{if(!r.ok)throw Error('data');return r.json()})
]).then(([t,data])=>{
  const version='1.3.2';
  const weatherDestinations=(data.weatherDestinations||[]).map(p=>p.id==='d055'?{...p,query:'Giardini-Naxos',latitude:37.82755,longitude:15.26713,sub:'天气点：Giardini-Naxos（固定坐标）'}:p);
  const defaults=JSON.stringify(weatherDestinations);
  t=t.replace(/const defaultPlaces=\[[\s\S]*?\];/,`const GUIDE_DATA_VERSION='${version}';const defaultPlaces=${defaults};`);
  t=t.replace(/const \$=s=>document\.querySelector\(s\);let places=JSON\.parse\(localStorage\.getItem\('italyTripPlaces'\)\|\|'null'\)\|\|defaultPlaces;/,
    "const $=s=>document.querySelector(s);const storedDataVersion=localStorage.getItem('italyTripDataVersion');let storedPlaces=JSON.parse(localStorage.getItem('italyTripPlaces')||'null');const defaultById=Object.fromEntries(defaultPlaces.map(p=>[p.id,p]));let places;if(storedDataVersion!==GUIDE_DATA_VERSION){places=(storedPlaces||defaultPlaces).map(p=>{const d=defaultById[p.id];if(!d)return p;return{...d,...p,query:p.id==='d055'?d.query:(p.query||d.query),latitude:d.latitude??p.latitude,longitude:d.longitude??p.longitude,sub:p.id==='d055'?d.sub:(p.sub||d.sub)}});localStorage.setItem('italyTripPlaces',JSON.stringify(places));localStorage.setItem('italyTripDataVersion',GUIDE_DATA_VERSION)}else{places=(storedPlaces||defaultPlaces).map(p=>{const d=defaultById[p.id];return d?{...d,...p,query:p.id==='d055'?d.query:(p.query||d.query),latitude:d.latitude??p.latitude,longitude:d.longitude??p.longitude,sub:p.id==='d055'?d.sub:(p.sub||d.sub)}:p})};");
  t=t.replace("if(!savedModules.includes('未分类'))savedModules.push('未分类');","");
  t=t.replaceAll("ensureModule('未分类');","");
  t=t.replace("updateSourceUI();updateLocationUI();updateSummary();setView('all');loadAll();","const __baseGeocode=geocode;geocode=async function(p){if(p&&p.latitude!=null&&p.longitude!=null)return{name:p.query||p.name,latitude:+p.latitude,longitude:+p.longitude,country_code:p.country||'IT'};return __baseGeocode(p)};const __gn=places.find(p=>p.id==='d055');if(__gn){Object.assign(__gn,{query:'Giardini-Naxos',country:'IT',latitude:37.82755,longitude:15.26713,sub:'天气点：Giardini-Naxos（固定坐标）'});savePlaces();}updateSourceUI();updateLocationUI();updateSummary();setView('all');loadAll();");
  t=t.replace("</head>","<link rel=\"stylesheet\" href=\"./weather-legend.css\"><link rel=\"stylesheet\" href=\"./desktop-weather-colors.css\"></head>");
  t=t.replace("</body>","<script src=\"./weather-first.js\"><"+"/script><script src=\"./weather-legend.js\"><"+"/script><script src=\"./desktop-weather-colors.js\"><"+"/script><script src=\"./module-manager-actions.js?v=4\"><"+"/script></body>");
  document.open();document.write(t);document.close();
}).catch(()=>{document.body.innerHTML="<p style='font-family:sans-serif;padding:24px'>Dashboard 加载失败，请刷新页面。</p>";});
</script>
