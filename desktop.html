<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italy Trip Dashboard</title>
<script>
const BASE="https://raw.githubusercontent.com/susanlondon/italy-weather-trip/e1a4ce6d3616110503cb712c1ff83cb9c2325737/index.html";
Promise.all([
  fetch(BASE).then(r=>{if(!r.ok)throw Error('base');return r.text()}),
  fetch("./guide-data-v1.3.json?v=1.3.1").then(r=>{if(!r.ok)throw Error('data');return r.json()})
]).then(([t,data])=>{
  const version=data.version||'1.3';
  const weatherDestinations=(data.weatherDestinations||[]).map(p=>p.id==='d055'?{...p,query:'Giardini-Naxos',latitude:37.82755,longitude:15.26713,sub:'天气点：Giardini-Naxos（使用坐标定位）'}:p);
  const defaults=JSON.stringify(weatherDestinations);
  t=t.replace(/const defaultPlaces=\[[\s\S]*?\];/,`const GUIDE_DATA_VERSION='${version}';const defaultPlaces=${defaults};`);
  t=t.replace(/const \$=s=>document\.querySelector\(s\);let places=JSON\.parse\(localStorage\.getItem\('italyTripPlaces'\)\|\|'null'\)\|\|defaultPlaces;/,
    "const $=s=>document.querySelector(s);const storedDataVersion=localStorage.getItem('italyTripDataVersion');let storedPlaces=JSON.parse(localStorage.getItem('italyTripPlaces')||'null');let places;if(storedDataVersion!==GUIDE_DATA_VERSION){const customPlaces=(storedPlaces||[]).filter(p=>String(p.id||'').startsWith('p_'));places=[...defaultPlaces,...customPlaces];localStorage.setItem('italyTripPlaces',JSON.stringify(places));localStorage.setItem('italyTripDataVersion',GUIDE_DATA_VERSION);localStorage.removeItem('italyTripModules')}else{const defaultById=Object.fromEntries(defaultPlaces.map(p=>[p.id,p]));places=(storedPlaces||defaultPlaces).map(p=>defaultById[p.id]?{...defaultById[p.id],...p,latitude:p.latitude??defaultById[p.id].latitude,longitude:p.longitude??defaultById[p.id].longitude}:p);};");
  t=t.replace("async function geocode(p){","async function geocode(p){if(p.latitude!=null&&p.longitude!=null)return{name:p.query||p.name,latitude:+p.latitude,longitude:+p.longitude,country_code:p.country||'IT'};");
  t=t.replace("if(!savedModules.includes('未分类'))savedModules.push('未分类');","");
  t=t.replaceAll("ensureModule('未分类');","");
  t=t.replace("</head>","<link rel=\"stylesheet\" href=\"./weather-legend.css\"><link rel=\"stylesheet\" href=\"./desktop-weather-colors.css\"></head>");
  t=t.replace("</body>","<script src=\"./weather-first.js\"><"+"/script><script src=\"./weather-legend.js\"><"+"/script><script src=\"./desktop-weather-colors.js\"><"+"/script><script src=\"./module-manager-actions.js?v=3\"><"+"/script></body>");
  document.open();document.write(t);document.close();
}).catch(()=>{document.body.innerHTML="<p style='font-family:sans-serif;padding:24px'>Dashboard 加载失败，请刷新页面。</p>";});
</script>
